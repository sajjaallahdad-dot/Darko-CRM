<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>داشبورد CRM دارکو</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B0000">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#333;font-family:Vazirmatn,Tahoma,sans-serif}button,input,select{font-family:inherit}.container{max-width:1200px;margin:auto;padding:14px}.hidden{display:none!important}
header{background:#8B0000;color:#fbf0da;padding:18px;border-radius:12px;margin-bottom:14px;text-align:center}header h1{margin:0 0 4px;font-size:23px}header p{margin:0;font-size:12px}
.auth{max-width:430px;margin:8vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001;border-top:4px solid #8B0000}.auth h2{color:#8B0000;margin-top:0}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700;color:#8B0000}.form input,.form select{width:100%;height:42px;padding:8px;border:1px solid #eadfc9;border-radius:8px;background:#fbf0da}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px;padding-bottom:3px}.nav button{white-space:nowrap;border:0;border-radius:9px;padding:10px 13px;background:#fbf0da;color:#8B0000;font-weight:700}.nav button.active{background:#8B0000;color:#fbf0da}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px #0000000d;margin-bottom:14px;border-right:4px solid #8B0000}.card h2,.card h3{margin:0 0 12px;color:#8B0000;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#fff;padding:16px;border-radius:12px;text-align:center;border-top:3px solid #8B0000}.stat small{display:block;color:#777}.stat strong{font-size:24px;color:#8B0000}
.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#8B0000;color:#fbf0da}.secondary{background:#707070;color:#fff}.danger{background:#555;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:12px}th{background:#8B0000;color:#fbf0da}.table-wrap{overflow:auto;border-radius:10px}
.notice{padding:10px;border-radius:8px;background:#fbf0da;color:#8B0000;font-size:12px;margin-bottom:10px}.error{background:#fee;color:#900}.userbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:12px}.money{font-size:28px;font-weight:800;color:#8B0000}
@media(max-width:700px){.container{padding:9px}.grid,.stats{grid-template-columns:1fr 1fr}header{padding:14px}header h1{font-size:19px}.card{padding:12px}.stat{padding:12px}.stat strong{font-size:20px}th,td{white-space:nowrap}.nav button{padding:9px 11px}}
</style>
</head>
<body>
<div id="login" class="auth">
<h2>ورود به CRM دارکو</h2>
<p style="font-size:12px;color:#777">دسترسی هر کاربر بر اساس نقش او کنترل می‌شود.</p>
<div class="form">
<label>ایمیل</label><input id="email" type="email" autocomplete="username">
<label>رمز عبور</label><input id="password" type="password" autocomplete="current-password">
<button class="btn primary" onclick="login()">ورود</button>
<div id="loginMsg" class="notice hidden"></div>
</div>
</div>

<div id="app" class="container hidden">
<header><h1>☕ CRM دارکو</h1><p>مدیریت لید، فروش و عملیات</p></header>
<div class="userbar"><span id="userInfo"></span><button class="btn secondary" onclick="logout()">خروج</button></div>
<div class="nav" id="nav"></div>
<div id="content"></div>
</div>

<script>
const SUPABASE_URL='https://jcpdzqilnhnljvrfsjug.supabase.co';
const SUPABASE_KEY='sb_publishable_IsYn6XHFo7AUOfE0BDyfZA_sjavx6Vr';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,permissions=new Set();

const tabs=[
 ['leads','ثبت لید','leads.manage'],['dashboard','داشبورد','dashboard.view'],
 ['leads-list','لیست لیدها','leads.view'],['sales','فروش من','sales.self.view'],
 ['total-sales','فروش کل','sales.total.view'],['import','صادر/وارد','leads.manage']
];

function msg(t,err=false){return '<div class="notice '+(err?'error':'')+'">'+t+'</div>'}
function toman(n){return new Intl.NumberFormat('fa-IR').format(Number(n||0))}
async function login(){
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 const box=document.getElementById('loginMsg');box.classList.remove('hidden');
 if(!email||!password){box.innerHTML=msg('ایمیل و رمز عبور را وارد کنید',true);return}
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){box.innerHTML=msg('ورود ناموفق بود. اطلاعات ورود را بررسی کنید.',true);return}
 await boot();
}
async function logout(){await sb.auth.signOut();location.reload()}

async function boot(){
 const {data:{user}}=await sb.auth.getUser(); if(!user){showLogin();return}
 currentUser=user;
 const {data:p,error}=await sb.from('dv_profiles').select('id,full_name,role,is_active').eq('id',user.id).maybeSingle();
 if(error||!p||!p.is_active){await sb.auth.signOut();showLogin('برای این حساب پروفایل فعال CRM وجود ندارد.');return}
 currentProfile=p;
 const {data:rps}=await sb.from('crm_role_permissions').select('permission_key').eq('role_key',p.role);
 permissions=new Set((rps||[]).map(x=>x.permission_key));
 document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 document.getElementById('userInfo').textContent=(p.full_name||user.email)+' · '+p.role;
 renderNav();openFirst();
}
function showLogin(t=''){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');if(t){const b=document.getElementById('loginMsg');b.classList.remove('hidden');b.innerHTML=msg(t,true)}}
function can(p){return permissions.has(p)}
function renderNav(){document.getElementById('nav').innerHTML=tabs.filter(x=>can(x[2])).map((x,i)=>'<button data-tab="'+x[0]+'" onclick="openTab(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function openFirst(){const x=tabs.find(x=>can(x[2]));if(x)openTab(x[0])}
async function openTab(name){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
 const c=document.getElementById('content');
 if(name==='leads')c.innerHTML=leadForm();
 if(name==='dashboard')c.innerHTML=dashboard();
 if(name==='leads-list')c.innerHTML=leadsList();
 if(name==='sales')c.innerHTML=await salesMine();
 if(name==='total-sales')c.innerHTML=await totalSales();
 if(name==='import')c.innerHTML=importExport();
 if(name==='dashboard')updateDashboard();
 if(name==='leads-list')renderLeadsList();
}
function leadForm(){return '<div class="card"><h2>⚡ ثبت لید</h2><form id="leadForm" class="form"><div class="grid"><div><label>شماره تلفن</label><input id="phone" required></div><div><label>نام</label><input id="name" required></div><div><label>کانال</label><select id="channel" required><option value="">انتخاب</option><option>اینستاگرام</option><option>تبلیغات خیابانی</option><option>کمپر</option><option>دهان به دهان</option><option>سایر</option></select></div><div><label>ساعت</label><input id="time" type="time" required></div></div><button class="btn primary">ثبت لید</button></form></div>'}
function dashboard(){return '<div class="stats"><div class="stat"><small>کل لیدها</small><strong id="totalLeads">۰</strong></div><div class="stat"><small>امروز</small><strong id="todayLeads">۰</strong></div><div class="stat"><small>این هفته</small><strong id="weekLeads">۰</strong></div><div class="stat"><small>این ماه</small><strong id="monthLeads">۰</strong></div></div><div class="card" style="margin-top:14px"><h3>لیدها به تفکیک کانال</h3><div id="channelStats"></div></div>'}
function leadsList(){return '<div class="card"><h2>لیست لیدها</h2><input id="search" placeholder="جستجوی نام یا شماره" oninput="renderLeadsList()" style="width:100%;padding:11px;border:1px solid #eadfc9;border-radius:8px;background:#fbf0da"><div id="leadTable" class="table-wrap" style="margin-top:12px"></div></div>'}
function importExport(){return '<div class="card"><h2>📥 وارد کردن / 📤 صادر کردن</h2><p>این بخش برای نسخه بعدی اتصال کامل لیدها به دیتابیس آماده شده است.</p><div class="actions"><button class="btn primary" onclick="exportToExcel()">دانلود لیدها</button></div></div>'}

document.addEventListener('submit',async e=>{
 if(e.target.id!=='leadForm')return;e.preventDefault();
 const lead={id:Date.now(),phone:phone.value.trim(),name:name.value.trim(),channel:channel.value,time:time.value,date:new Date().toISOString().slice(0,10),createdAt:new Date().toISOString()};
 const a=JSON.parse(localStorage.getItem('darko_crm_leads')||'[]');a.push(lead);localStorage.setItem('darko_crm_leads',JSON.stringify(a));
 e.target.reset();alert('✓ لید ثبت شد');openTab('dashboard');
});
function getLeads(){return JSON.parse(localStorage.getItem('darko_crm_leads')||'[]')}
function updateDashboard(){const a=getLeads(),d=new Date().toISOString().slice(0,10),w=new Date(Date.now()-604800000).toISOString().slice(0,10),m=new Date(Date.now()-2592000000).toISOString().slice(0,10);totalLeads.textContent=toman(a.length);todayLeads.textContent=toman(a.filter(x=>x.date===d).length);weekLeads.textContent=toman(a.filter(x=>x.date>=w).length);monthLeads.textContent=toman(a.filter(x=>x.date>=m).length);const c={};a.forEach(x=>c[x.channel]=(c[x.channel]||0)+1);channelStats.innerHTML=Object.entries(c).map(([k,v])=>'<div style="margin:8px 0"><b>'+k+'</b> · '+toman(v)+' لید</div>').join('')||'داده‌ای نیست'}
function renderLeadsList(){const q=(document.getElementById('search')?.value||'').toLowerCase(),a=getLeads().filter(x=>x.name.toLowerCase().includes(q)||x.phone.includes(q));document.getElementById('leadTable').innerHTML='<table><thead><tr><th>نام</th><th>شماره</th><th>کانال</th><th>تاریخ</th></tr></thead><tbody>'+a.slice().reverse().map(x=>'<tr><td>'+x.name+'</td><td>'+x.phone+'</td><td>'+x.channel+'</td><td>'+x.date+' '+x.time+'</td></tr>').join('')+'</tbody></table>'}
async function salesMine(){
 if(!can('sales.self.view'))return msg('دسترسی فروش برای این حساب فعال نیست.',true);
 const {data,error}=await sb.from('crm_sales').select('id,amount,sale_date,channel,description').eq('seller_id',currentUser.id).order('sale_date',{ascending:false});
 if(error)return msg('خطا در دریافت فروش.',true);
 return '<div class="card"><h2>فروش من</h2><div class="money">'+toman(data.reduce((s,x)=>s+Number(x.amount),0))+' تومان</div><p style="color:#777;font-size:12px">این عدد فقط فروش ثبت‌شده توسط حساب شماست.</p><form id="saleForm" class="form"><div class="grid"><div><label>مبلغ فروش</label><input id="saleAmount" type="number" min="1" required></div><div><label>تاریخ</label><input id="saleDate" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div><div><label>کانال</label><input id="saleChannel" placeholder="شوروم / اینستاگرام / ..."></div><div><label>توضیح</label><input id="saleDesc"></div></div><button class="btn primary">ثبت فروش من</button></form></div><div class="card"><h3>سوابق فروش من</h3>'+salesTable(data)+'</div>'}
function salesTable(a){return '<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>مبلغ</th><th>کانال</th><th>توضیح</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+x.sale_date+'</td><td>'+toman(x.amount)+' تومان</td><td>'+(x.channel||'-')+'</td><td>'+(x.description||'-')+'</td></tr>').join('')+'</tbody></table></div>'}
async function totalSales(){
 if(!can('sales.total.view'))return msg('این بخش فقط برای مدیر و ادمین است.',true);
 const {data,error}=await sb.from('crm_sales_total').select('*').single();
 if(error)return msg('خطا در دریافت فروش کل: '+error.message,true);
 return '<div class="card"><h2>🔒 فروش کل</h2><div class="money">'+toman(data.total_sales)+' تومان</div><p>تعداد تراکنش‌ها: '+toman(data.sale_count)+'</p><div class="notice">این اطلاعات به دلیل مجوز نقش، برای فروشنده و پرسنل قابل دسترسی نیست.</div></div>'}
document.addEventListener('submit',async e=>{if(e.target.id!=='saleForm')return;e.preventDefault();const {error}=await sb.from('crm_sales').insert({seller_id:currentUser.id,amount:Number(saleAmount.value),sale_date:saleDate.value,channel:saleChannel.value||null,description:saleDesc.value||null});if(error)alert('ثبت فروش ناموفق: '+error.message);else openTab('sales')});
function exportToExcel(){const a=getLeads();if(!a.length)return alert('لیدی وجود ندارد');const ws=XLSX.utils.json_to_sheet(a.map(x=>({'شماره تلفن':x.phone,'نام':x.name,'کانال':x.channel,'ساعت':x.time,'تاریخ':x.date})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'لیدها');XLSX.writeFile(wb,'دارکو-لیدها.xlsx')}
sb.auth.getSession().then(async({data})=>{if(data.session)await boot()});
</script>
</body>
</html>
